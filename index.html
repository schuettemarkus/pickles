<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- app -->
<title>Pickles Weekend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one screen. Pot banner on top, then eight rows with big +/- targets. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --surface-2:#E7ECE3; --ink:#14202A; --muted:#5B686F; --line:#D7DFD3;
  --court:#1C4E79; --court-ink:#FFFFFF; --ball:#D4EC38; --ball-ink:#1D2500;
  --loss:#BD3F2A; --loss-bg:#F8E5E0; --win:#167A46;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 8px 24px rgba(20,32,42,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1318; --surface:#141E26; --surface-2:#1B2731; --ink:#E6ECEE; --muted:#93A1A9; --line:#24333E;
  --court:#2F6DA6; --court-ink:#FFFFFF; --ball:#CBE53A; --ball-ink:#1D2500;
  --loss:#F07360; --loss-bg:#3A1D18; --win:#43C07D;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1318; --surface:#141E26; --surface-2:#1B2731; --ink:#E6ECEE; --muted:#93A1A9; --line:#24333E;
  --court:#2F6DA6; --court-ink:#FFFFFF; --ball:#CBE53A; --ball-ink:#1D2500;
  --loss:#F07360; --loss-bg:#3A1D18; --win:#43C07D;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--court);outline-offset:2px;border-radius:8px}
input{font:inherit;color:inherit}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ball{width:26px;height:26px;border-radius:50%;background:var(--ball);position:relative;flex:none;box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
.ball::before{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--ball-ink);opacity:.35;top:7px;left:7px;box-shadow:8px 3px 0 var(--ball-ink),2px 9px 0 var(--ball-ink),10px 11px 0 var(--ball-ink)}
.brand h1{font-size:20px;font-weight:800}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live{color:var(--win)} .pill.warn{color:var(--loss)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.track{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--loss)}
.switch[aria-checked="true"] .track::after{transform:translateX(18px)}
.switch[aria-checked="true"]{color:var(--loss)}

main{padding-block:16px calc(28px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.pot{background:var(--court);color:var(--court-ink);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.pot .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pot .amt{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.pot .lead{font-size:15px;font-weight:600}
.pot .lead b{color:var(--ball)}
.pot .crown-bg{position:absolute;right:-12px;top:-8px;width:120px;height:120px;opacity:.12}
.buyin{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600}
.buyin input{width:84px;padding:6px 10px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:inherit;font-weight:700;font-size:16px}
.buyin input::placeholder{color:inherit;opacity:.6}

.board{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px 14px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rk{font-family:var(--f-display);font-weight:800;color:var(--muted);text-align:center;border-radius:6px;font-variant-numeric:tabular-nums}
.row.first .rk{background:var(--ball);color:var(--ball-ink)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}
.who b{display:block;font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:break-word}
.who .real{display:block;font-size:12px;color:var(--muted)}
.av{--h:#888;width:32px;height:32px;border-radius:50%;background:var(--h);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:15px;flex:none;font-family:var(--f-display)}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:42px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:700;line-height:1}
.ctl button.plus{background:var(--ball);color:var(--ball-ink)}
.ctl button:active:not(:disabled){transform:scale(.94)}
.pts{min-width:40px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.pts.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.go{background:var(--ball);color:var(--ball-ink)}
.share{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.share span{color:var(--muted)}
.join{display:flex;gap:8px}
.join .btn{flex:none}
.joinin{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface-2);min-height:42px;flex:1}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:0}
.banner{padding:10px 14px;border-radius:12px;background:var(--loss-bg);color:var(--loss);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:min(92vw,440px);text-align:center;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:440px){.who .av{display:none}}
@media (max-width:370px){.ctl button{width:38px;height:40px}.pts{min-width:32px;font-size:24px}.who b{font-size:14px}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span class="ball" aria-hidden="true"></span><h1>Pickles</h1><span id="status"></span></div>
  <button class="switch" id="crude" role="switch" aria-checked="false"><span>Crude</span><span class="track"></span></button>
</div></header>
<main><div class="wrap stack" id="main"></div></main>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const PLAYERS = [
  ["tyler","Tyler","Airbnballsack"],
  ["reid","Reid","Bump, Set, Dump"],
  ["lowell","Lowell","Low-T Lowell"],
  ["robert","Robert","Silent But Deadly Bobby"],
  ["markus","Markus","Skidmarkus"],
  ["curt","Curt","Chain-Banger Curt"],
  ["sam","Sam","Swamp Ass Sam"],
  ["jake","Jake","Jock Itch Jake"],
];
const HUES = ["#D9623A","#2A8C80","#7458D1","#C23D6B","#2B6BCB","#B07418","#3B9447","#86573F"];
const IDS = PLAYERS.map(p=>p[0]);
const CROWN = '<svg class="crown-bg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

/* state: pts[id] = number; buyIn = number */
const S = { mode:"local", status:"local", pts:{}, buyIn:0, readOnly:false };
const ui = { crude: LS.get("pickles:crude",false), order: null, confirm:false, copy:null, bumped:null };
let db=null;

function loadLocal(){ const d=LS.get("pickles:board",null); if(d){ S.pts=d.pts||{}; S.buyIn=d.buyIn||0; } }
function saveLocal(){ LS.set("pickles:board",{pts:S.pts,buyIn:S.buyIn}); }

const queues={};
function write(path,obj){
  if(S.mode==="local"){ saveLocal(); return; }
  const q=queues[path]||(queues[path]={busy:false,next:undefined}); q.next=obj; if(!q.busy) flush(path);
}
async function flush(path){
  const q=queues[path]; q.busy=true;
  while(q.next!==undefined){
    const v=q.next; q.next=undefined;
    try{ await db.doc(path).set(v); }
    catch(e){
      if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); if(q.next===undefined) q.next=v; continue; }
      if(e&&e.code==="invalid_argument"){ S.readOnly=true; render(); toast("Couldn't save. You have view-only access."); }
      else toast("Couldn't save that change. Check your connection.");
    }
  }
  q.busy=false;
}
async function connect(){
  if(!window.claude || typeof window.claude.use!=="function"){ render(); return; }
  S.status="connecting"; render();
  let d=null; try{ d=await window.claude.use("db"); }catch{}
  if(!d){ S.status="local"; render(); return; }
  db=d; S.mode="remote"; S.status="syncing"; S.pts={}; S.buyIn=0; render();
  try{ const user=await window.claude.use("user"); if(user&&typeof user.can==="function"&&(await user.can("data.write"))===false){ S.readOnly=true; render(); } }catch{}
  const got=new Set(); const timer=setTimeout(()=>{ if(S.status==="syncing"){ S.status="slow"; render(); } },10000);
  const ok=(k,snap)=>{ if(!snap.metadata.fromCache){ got.add(k); if(got.size===2){ clearTimeout(timer); S.status="live"; } } };
  const fail=()=>{ clearTimeout(timer); S.status="offline"; render(); };
  db.collection("points").onSnapshot(snap=>{ const o={}; snap.docs.forEach(doc=>{ o[doc.id]=+(doc.data().pts)||0; }); S.pts=o; ok("p",snap); render(); }, fail);
  db.doc("config/pot").onSnapshot(snap=>{ S.buyIn=snap.exists?(+snap.data().buyIn||0):0; ok("c",snap); render(); }, fail);
}

/* ---------- shared board on JSONBlob (used when not running as a Claude artifact) ----------
   JSONBlob has no locking, so two phones saving at once can overwrite each other. To never lose a tap,
   each phone owns one entry: its own running tally. The board total is the sum of every phone's tally.
   Each phone keeps its tally on the device too, and rewrites its entry whenever the server copy is
   missing or stale, so an overwritten entry heals within a few seconds.
   doc = { epoch, dev: { <phoneId>: { e:epoch, p:{player:delta}, b:buyIn, bt:time } } } */
const BLOB_API="https://jsonblob.com/api/jsonBlob";
const DEV_ID = LS.get("pickles:dev",null) || (()=>{ const v=Math.random().toString(36).slice(2,12); LS.set("pickles:dev",v); return v; })();
const blob={ id:null, doc:{epoch:0,dev:{}}, mine:null, resetPending:false, flushing:false, t:null, poll:null };
const mineKey=()=>"pickles:mine:"+blob.id;
function saveMine(){ LS.set(mineKey(),blob.mine); }
function totals(doc,mine){
  const dev={...(doc.dev||{})};
  if(mine && mine.e>=(doc.epoch||0)) dev[DEV_ID]=mine;
  const out={}; IDS.forEach(id=>out[id]=0); let b=0, bt=-1;
  Object.values(dev).forEach(d=>{
    if(!d || d.e!==Math.max(doc.epoch||0, mine?mine.e:0)) return;
    Object.entries(d.p||{}).forEach(([id,n])=>{ if(id in out) out[id]+=+n||0; });
    if((d.bt||0)>bt && d.b!==undefined){ bt=d.bt||0; b=+d.b||0; }
  });
  IDS.forEach(id=>{ out[id]=Math.max(0,out[id]); });
  return {pts:out,buyIn:b};
}
function showBlob(){ const v=totals(blob.doc,blob.mine); S.pts=v.pts; S.buyIn=v.buyIn; }
const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
async function blobGet(){
  const r=await fetch(`${BLOB_API}/${blob.id}`,{headers:{Accept:"application/json"},cache:"no-store"});
  if(r.status===404) throw Object.assign(new Error("gone"),{gone:true});
  if(!r.ok) throw new Error("get "+r.status);
  const j=await r.json();
  if(!j || typeof j!=="object") return {epoch:0,dev:{}};
  if(!j.dev){ // board created before this format: fold its numbers into a starter entry
    const p={}; IDS.forEach(id=>{ const n=+((j.pts||{})[id])||0; if(n) p[id]=n; });
    return {epoch:0,dev:{seed:{e:0,p,b:+j.buyIn||0,bt:0}}};
  }
  return j;
}
function adopt(doc){
  blob.doc=doc;
  if((doc.epoch||0)>blob.mine.e){ blob.mine={e:doc.epoch,p:{},b:blob.mine.b,bt:0}; saveMine(); } // someone reset the board
}
function needsWrite(){
  if(blob.resetPending) return true;
  if(blob.mine.e>(blob.doc.epoch||0)) return true;          // our reset got overwritten
  const hasMine=Object.keys(blob.mine.p).length||blob.mine.bt;
  return !!hasMine && !same((blob.doc.dev||{})[DEV_ID],blob.mine);
}
async function blobPoll(){
  if(!blob.id || blob.flushing || document.visibilityState==="hidden") return;
  try{ adopt(await blobGet()); if(needsWrite()){ S.status="syncing"; blobQueue(); } else S.status="live"; }
  catch(e){ S.status = e.gone ? "gone" : "offline"; }
  showBlob(); render();
}
function blobQueue(){ clearTimeout(blob.t); blob.t=setTimeout(blobFlush,450); }
async function blobFlush(){
  if(blob.flushing) return;
  blob.flushing=true;
  try{
    let doc=await blobGet(); adopt(doc);
    if(blob.resetPending || blob.mine.e>(doc.epoch||0)){
      const e=Math.max(doc.epoch||0, blob.mine.e) + (blob.resetPending?1:0);
      blob.mine={e,p:{},b:blob.mine.b,bt:blob.mine.bt}; saveMine();
      doc={epoch:e,dev:{}}; blob.resetPending=false;
    }
    const next={epoch:doc.epoch||0, dev:{...(doc.dev||{}),[DEV_ID]:clone(blob.mine)}, updated:Date.now()};
    const r=await fetch(`${BLOB_API}/${blob.id}`,{method:"PUT",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(next)});
    if(!r.ok) throw new Error("put "+r.status);
    blob.doc=next; S.status="live";
  }catch(e){ S.status = e.gone ? "gone" : "offline"; setTimeout(blobQueue,3000); }
  blob.flushing=false; showBlob(); render();
}
const clone=o=>JSON.parse(JSON.stringify(o));
function blobTap(id,d){ blob.mine.p[id]=(blob.mine.p[id]||0)+d; if(!blob.mine.p[id]) delete blob.mine.p[id]; saveMine(); showBlob(); blobQueue(); }
function blobBuyIn(v){ blob.mine.b=v; blob.mine.bt=Date.now(); saveMine(); showBlob(); blobQueue(); }
function blobReset(){ blob.resetPending=true; blob.mine={e:blob.mine.e,p:{},b:blob.mine.b,bt:blob.mine.bt}; blob.doc={epoch:blob.doc.epoch,dev:{}}; saveMine(); showBlob(); blobQueue(); }
function idFromHash(){ const m=location.hash.match(/^#([A-Za-z0-9_-]{6,80})$/); return m?m[1]:null; }
function startBlob(id, seed){
  blob.id=id; S.mode="blob"; S.status="syncing";
  blob.mine = seed || LS.get(mineKey(),null) || {e:0,p:{},b:0,bt:0};
  saveMine(); blob.doc={epoch:blob.mine.e,dev:{}};
  LS.set("pickles:blob",id);
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
  showBlob(); render(); blobPoll();
  clearInterval(blob.poll); blob.poll=setInterval(blobPoll,4000);
}
async function createBoard(){
  if(ui.creating) return; ui.creating=true; render();
  try{
    const p={}; IDS.forEach(id=>{ if(S.pts[id]) p[id]=S.pts[id]; });
    const mine={e:0,p,b:S.buyIn||0,bt:S.buyIn?Date.now():0};
    const data={epoch:0,dev:{[DEV_ID]:mine},updated:Date.now()};
    const r=await fetch(BLOB_API,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
    if(!r.ok) throw new Error("post "+r.status);
    const loc=r.headers.get("Location")||r.headers.get("X-Jsonblob-Id")||r.headers.get("X-jsonblob")||"";
    const id=(loc.match(/([A-Za-z0-9_-]{6,80})\/?$/)||[])[1];
    if(!id) throw new Error("no id");
    startBlob(id, mine); blob.doc=data; showBlob(); render();
    toast("Shared scoreboard created. Now copy the link and send it to the group.");
  }catch(e){ ui.createFailed=true; toast("Couldn't create it automatically. Try the manual steps instead."); }
  ui.creating=false; render();
}
function joinBoard(v){
  const id=((v||"").trim().match(/([A-Za-z0-9_-]{6,80})\/?$/)||[])[1];
  if(!id){ toast("That doesn't look like a board link or ID."); return; }
  startBlob(id);
}
async function shareLink(){
  const url=location.href;
  try{ await navigator.clipboard.writeText(url); toast("Link copied. Send it to the group."); }catch{ ui.copy=url; renderSheet(); }
}
window.addEventListener("hashchange",()=>{ const id=idFromHash(); if(id&&id!==blob.id) startBlob(id); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") blobPoll(); });

function nm(id){ const p=PLAYERS.find(x=>x[0]===id); return ui.crude?p[2]:p[1]; }
function pts(id){ return S.pts[id]||0; }
function sorted(){ return [...IDS].sort((a,b)=>pts(b)-pts(a) || IDS.indexOf(a)-IDS.indexOf(b)); }

/* Keep rows still while someone is tapping; re-sort after a pause. */
let settle=null;
function holdOrder(){ if(!ui.order) ui.order=sorted(); clearTimeout(settle); settle=setTimeout(()=>{ ui.order=null; render(); },1400); }

function change(id,d){
  if(S.readOnly){ toast("View only. Ask the organizer for edit access."); return; }
  const n=Math.max(0,pts(id)+d); if(n===pts(id)) return;
  holdOrder();
  ui.bumped=id;
  if(S.mode==="blob"){ blobTap(id,n-pts(id)); render(); }
  else { S.pts={...S.pts,[id]:n}; write("points/"+id,{pts:n}); render(); }
  if(navigator.vibrate) try{ navigator.vibrate(10); }catch{}
}
function setBuyIn(v){
  if(S.readOnly) return;
  const b=Math.max(0,Math.min(10000,Math.round(+v||0)));
  if(S.mode==="blob"){ blobBuyIn(b); render(); return; }
  S.buyIn=b; write("config/pot",{buyIn:S.buyIn}); render();
}
function resetAll(){
  if(S.readOnly) return;
  if(S.mode==="blob") blobReset();
  else IDS.forEach(id=>{ if(pts(id)){ S.pts={...S.pts,[id]:0}; write("points/"+id,{pts:0}); } });
  ui.order=null; render(); toast("Everyone's back to zero.");
}

function render(){
  const st={local:["On this device",""],connecting:["Connecting",""],syncing:["Syncing",""],live:["Live","live"],slow:["Can't reach sync","warn"],offline:["Offline · retrying","warn"],gone:["Board not found","warn"]}[S.status];
  $("#status").innerHTML=`<span class="pill ${S.readOnly?"warn":st[1]}"><i></i>${S.readOnly?"View only":st[0]}</span>`;
  $("#crude").setAttribute("aria-checked",String(!!ui.crude));

  const order=ui.order||sorted();
  const rank=sorted(); const top=pts(rank[0]);
  const leaders=rank.filter(id=>pts(id)===top);
  const second=rank.find(id=>pts(id)<top);
  const pot=S.buyIn*IDS.length;
  const lead = !top ? "Nobody's on the board yet."
    : leaders.length>1 ? `Tied at ${top}: <b>${leaders.map(id=>esc(nm(id))).join(", ")}</b>`
    : `<b>${esc(nm(rank[0]))}</b> leads with ${top}${second!==undefined?`, ${top-pts(second)} ahead`:""}`;

  const ae=document.activeElement; const editingBuy = ae && (ae.id==="buyin"||ae.id==="joinid");
  let h="";
  if(S.readOnly) h+=`<div class="banner">You're viewing a shared leaderboard. Ask the organizer for Contributor access to change points.</div>`;
  if(S.mode==="local" && !inArtifact){
    h+=`<div class="share"><b>Scores are only on this phone right now.</b>
      <span>Make a shared scoreboard and everyone with the link sees the same points.</span>
      <button class="btn go" data-act="create" ${ui.creating?"disabled":""}>${ui.creating?"Creating…":"Create shared scoreboard"}</button>
      ${ui.createFailed?`<span>Or do it by hand: open <b>jsonblob.com</b>, tap <b>Save</b>, copy the ID at the end of the address bar, and paste it here.</span>`:`<span>Already have a link from the group? Just open it. Or paste the ID:</span>`}
      <div class="join"><input id="joinid" class="joinin" placeholder="Board ID" autocomplete="off" autocapitalize="off"><button class="btn" data-act="join">Join</button></div></div>`;
  }
  if(S.mode==="blob" && S.status==="gone") h+=`<div class="banner">This board doesn't exist anymore. JSONBlob may have deleted it. Clear the part after # in the address bar to start a new one.</div>`;
  h+=`<div class="pot">${CROWN}<span class="eyebrow">The pot</span><span class="amt">${pot?"$"+pot:"$—"}</span><span class="lead">${lead}</span>
    <label class="buyin" for="buyin">Buy-in $<input id="buyin" type="number" inputmode="numeric" min="0" placeholder="0" value="${S.buyIn||""}" ${S.readOnly?"disabled":""}> each</label></div>`;
  h+=`<div class="board">${order.map(id=>{
      const p=pts(id); const r=rank.findIndex(x=>pts(x)===p)+1;
      return `<div class="row ${r===1&&p?"first":""}"><span class="rk">${r}</span>
        <div class="who"><span class="av" style="--h:${HUES[IDS.indexOf(id)]}" aria-hidden="true">${esc(PLAYERS[IDS.indexOf(id)][1][0])}</span><div><b>${esc(nm(id))}</b>${ui.crude?`<span class="real">${esc(PLAYERS[IDS.indexOf(id)][1])}</span>`:""}</div></div>
        <div class="ctl"><button data-id="${id}" data-d="-1" aria-label="Take a point from ${esc(nm(id))}" ${p===0||S.readOnly?"disabled":""}>−</button>
        <span class="pts ${ui.bumped===id?"bump":""}" aria-label="${p} points">${p}</span>
        <button class="plus" data-id="${id}" data-d="1" aria-label="Give ${esc(nm(id))} a point" ${S.readOnly?"disabled":""}>+</button></div></div>`;
    }).join("")}</div>`;
  h+=`<div class="actions">${S.mode==="blob"?`<button class="btn go" data-act="share">Copy link for the group</button>`:""}<button class="btn" data-act="copy">Copy standings</button>
    <button class="btn danger ${ui.confirm?"armed":""}" data-act="reset" ${S.readOnly?"disabled":""}>${ui.confirm?"Really reset to 0?":"Reset all"}</button></div>
    <p class="hint">${S.mode==="remote"?"Points sync live to everyone with this page open.":S.mode==="blob"?"Everyone with this link sees the same points. Other phones refresh every few seconds.":"Points are saved on this device."} One point per King's Court win. Most points at the end takes the pot.</p>`;

  if(editingBuy){ // don't rebuild the input mid-typing
    const board=$("#main .board"); if(board){ const tmp=document.createElement("div"); tmp.innerHTML=h; board.replaceWith(tmp.querySelector(".board")); const l=$("#main .lead"); if(l) l.innerHTML=lead; }
  } else $("#main").innerHTML=h;
  ui.bumped=null;
  renderSheet();
}
function renderSheet(){
  const el=$("#sheet");
  if(!ui.copy){ el.innerHTML=""; return; }
  if(el.firstChild) return;
  el.innerHTML=`<div class="sheet-bg" data-act="close"><div class="sheet" data-stop="1"><h2 style="font-size:20px">Copy this</h2><textarea id="copy-area" rows="10" readonly>${esc(ui.copy)}</textarea><button class="btn" data-act="close">Done</button></div></div>`;
  const ta=$("#copy-area"); ta.focus(); ta.select();
}
function standingsText(){
  const r=sorted(); const pot=S.buyIn*IDS.length;
  return `👑 King's Court points${pot?` · Pot: $${pot}`:""}\n`+r.map((id,i)=>`${r.findIndex(x=>pts(x)===pts(id))+1}. ${nm(id)}: ${pts(id)}`).join("\n");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2200); }

document.addEventListener("click", async e=>{
  const pb=e.target.closest("button[data-id]");
  if(pb){ change(pb.dataset.id,+pb.dataset.d); return; }
  if(e.target.closest("#crude")){ ui.crude=!ui.crude; LS.set("pickles:crude",ui.crude); render(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="close"){ if(e.target.closest("[data-stop]") && !e.target.closest('button[data-act="close"]')) return; ui.copy=null; renderSheet(); }
  if(a==="create"){ createBoard(); return; }
  if(a==="join"){ joinBoard(($("#joinid")||{}).value); return; }
  if(a==="share"){ shareLink(); return; }
  if(a==="copy"){ const t=standingsText(); try{ await navigator.clipboard.writeText(t); toast("Copied. Paste it in the group chat."); }catch{ ui.copy=t; renderSheet(); } }
  if(a==="reset"){ if(ui.confirm){ ui.confirm=false; resetAll(); } else { ui.confirm=true; render(); setTimeout(()=>{ if(ui.confirm){ ui.confirm=false; render(); } },3500); } }
});
document.addEventListener("change", e=>{ if(e.target.id==="buyin") setBuyIn(e.target.value); });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="joinid") joinBoard(e.target.value); if(e.key==="Enter" && e.target.id==="buyin") e.target.blur(); if(e.key==="Escape" && ui.copy){ ui.copy=null; renderSheet(); } });
document.addEventListener("focusout", e=>{ if(e.target.id==="buyin") setTimeout(render,0); });

const inArtifact = !!(window.claude && typeof window.claude.use==="function");
loadLocal();
const startId = inArtifact ? null : (idFromHash() || LS.get("pickles:blob",null));
if(startId) startBlob(startId); else render();
connect();
})();
</script>
</body></html>
